<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Title, description, canonical, Open Graph, Twitter y JSON-LD de cada
      página se inyectan aquí en el build (ver seoPagesPlugin en
      vite.config.ts y src/seo/site.ts). No escribir esas etiquetas a mano.
    -->
    <!--seo:head-->

    <!--
      Restaura la ruta de SPA guardada por 404.html en GitHub Pages.
      Decodifica la URL del formato /?/ruta y la reescribe con replaceState
      antes de que React Router monte, para que el deep-link funcione.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
