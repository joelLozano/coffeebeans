<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Coffee Beans</title>
    <!--
      Redirección para SPA en GitHub Pages.
      GitHub Pages no reescribe rutas desconocidas a index.html, así que al
      recargar una ruta del cliente (p. ej. /coffeebeans/contacto) devuelve 404.
      Este script guarda la ruta solicitada y redirige a index.html, que la
      restaura. Basado en la técnica de spa-github-pages (rafgraph).

      pathSegmentsToKeep = 1 porque el sitio vive bajo /coffeebeans/.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
